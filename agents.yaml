# Agent identities for the agentic-PR collection (Phase 0.1 deliverable).
# Verified live against the GitHub API on 2026-06-24 (account: rbodkin).
#
# Two detection paths exist; the spec's author-only model misses two agents:
#   author_search  -> GET /search/issues?q=is:pr+author:<handle>   (PR creator IS the bot)
#   commit_search  -> GET /search/commits?q=<committer|author-email> (PR creator is the
#                     HUMAN; the agent appears only in commit metadata / co-author trailer)
# Both Search APIs share the same hard limits: 1000 results/query, 30 req/min.
# Counts below are GLOBAL (all of GitHub), pre AI-R&D filtering, for sanity only.

meta:
  verified_at: "2026-06-24"
  verified_by: rbodkin
  notes: >
    botcommits.dev uses commit-trailer methodology only, so it sees Codex/Claude/Devin
    but NOT Copilot/Cursor (which leave no commit markers and are found by author search).
    The two methodologies are complementary; use both.

agents:
  - name: Devin
    detection: author_search
    author_logins: ["devin-ai-integration[bot]"]
    also_commit_committer: ["devin-ai-integration[bot]"]   # backup / cross-check
    counts: { pr_author: 176998, commit_committer: 202499 }
    status: confirmed
    notes: >
      Newer activity also attributed as "devin-ai" per botcommits.dev (Nov 2025+).
      PR-author search is the primary path; cover the committer trailer as backup.

  - name: GitHub Copilot
    detection: author_search
    author_logins: ["copilot-swe-agent[bot]"]
    counts: { pr_author: 1963540 }
    status: confirmed
    notes: Surfaces as "Copilot". No commit-level attribution marker; author search only.

  - name: Cursor
    detection: author_search + commit_search   # CORRECTED 2026-06-26
    author_logins: ["cursor[bot]"]             # cloud Background Agent only
    commit_coauthor_email: ["cursoragent@cursor.com"]   # Cursor Agent co-author trailer
    coauthor_trailer: "Co-authored-by: Cursor <cursoragent@cursor.com>"
    counts: { pr_author: 50760, coauthor_trailer_examples: "OpenBMB 799, QwenLM 7, mistralai 6" }
    status: confirmed
    notes: >
      CORRECTION (2026-06-26): the 2026-06-24 note that "cursoragent returns 0" was
      testing it as a PR-AUTHOR handle. Cursor's Agent does NOT author PRs but DOES
      write a commit co-author trailer `Co-authored-by: Cursor <cursoragent@cursor.com>`
      (human stays author/committer). This is a real, high-volume detection path missed
      by author search -- OpenBMB alone has 799 such commits while showing ~0 cursor[bot]
      PRs. The Cursor *IDE* (local, no agent) still leaves no marker. Find the trailer via
      BARE-TERM commit search (`cursoragent@cursor.com`), NOT `author-email:` (see Claude
      Code note + artifacts/agent_detection_cues.md).

  - name: Google Jules
    detection: author_search
    author_logins: ["google-labs-jules[bot]"]
    counts: { pr_author: 303077 }
    status: confirmed
    notes: Postdates the AIDev 2025-08 snapshot; new to this collection.

  - name: OpenAI Codex
    detection: commit_search
    author_logins: []                       # NOT a PR-author bot; all variants returned 0
    commit_committer: ["chatgpt-codex-connector[bot]"]   # cloud agent (GitHub App)
    commit_author_email: ["codex@openai.com", "noreply@openai.com"]  # opt-in CLI identity
    counts: { codex_at_openai_email: 118685, noreply_openai_email: 4589, commit_committer: 556 }
    visibility_note: "see artifacts/codex_visibility.md -- ~120k visible, ~3% of likely true volume"
    status: confirmed_handle_changed
    detection_gap: severe   # local CLI usage is structurally unobservable
    notes: >
      "Least stable" per spec, now confirmed: Codex CLOUD commits via the GitHub App
      (committer chatgpt-codex-connector[bot]) but the PR is opened by the human, so
      author search finds nothing. Enumerate via Search Commits, then map commit -> PR.
      The codex/ head-branch convention is NOT reliable (matches human branches too).
      EMPIRICAL TEST (chain-ml/agent-reputation, 2026-06-24): a repo where the owner
      used Codex CLI for several PRs (#1,#3,#5,#8,#11 'codex-*' branches) yielded ZERO
      Codex-attributable commits -- no bot committer, no noreply@openai.com email, no
      trailer. Codex commits were indistinguishable from human commits. The only Codex
      traces were human-typed branch names and prose ("Address Codex review feedback").
      Conclusion: the 556/4589 global counts capture only CLOUD Codex (+ CLI configured
      to attribute); locally-run Codex CLI is invisible to all metadata methods. Codex
      coverage will be a worse undercount than Claude Code. Report it as such; do not
      attempt the codex/ branch heuristic.
      SOURCE CONFIRMATION (openai/codex discussion #9449, Jan 2026): an OpenAI
      maintainer states "Codex itself doesn't create commits, it only generates code.
      The actual commit (author, email, message, trailers) is entirely controlled by
      the user's Git setup." No Co-Authored-By is added by default; users must opt in
      (e.g. instruct via AGENTS.md). This makes the undercount STRUCTURAL, not a handle
      drift -- there is no reliable global signal for default Codex usage.
    source_url: https://github.com/openai/codex/discussions/9449

  - name: Claude Code
    detection: commit_search                  # also: claude[bot] PR-author app (see below)
    author_logins: ["claude[bot]"]            # NEW 2026-06-26: Claude GitHub app/Action PRs (~18.7k global; CONFIRM it's Anthropic's)
    commit_coauthor_email: ["noreply@anthropic.com"]   # co-author trailer
    commit_footer_text: "Generated with [Claude Code]"  # most reliable text marker
    coauthor_trailer: "Co-Authored-By: Claude <noreply@anthropic.com>"
    counts:
      author_email_qualifier_global: 5311788   # author-email:noreply@anthropic.com (primary-author only)
      bare_term_global: 15715349               # bare noreply@anthropic.com (superset incl. co-authors)
    query_method: BARE_TERM    # CRITICAL: do NOT use the author-email: qualifier for org-scoped recall
    status: confirmed
    notes: >
      KEY FINDING: the Search Commits API indexes co-author emails as authors, so
      author-email:noreply@anthropic.com surfaces ~6.3M commits globally -- a far better
      recovery path than AIDev's author-only count of 5137. GraphQL commit.authors also
      exposes the trailer at hydration (observed names e.g. "Claude Opus 4.8 (1M context)",
      "Claude Sonnet 4.6"), confirming PR-level recovery. Report recovery rate openly.
      EMPIRICAL TEST (chain-ml/agent-reputation, 2026-06-24): 21/21 Claude-assisted
      commits correctly detected via the noreply@anthropic.com trailer (observed name
      "Claude Opus 4.6"). Trailer is written by default, so recovery is reliable --
      unlike Codex CLI in the same repo, which left no marker at all.
      CORRECTION (2026-06-26): the `author-email:noreply@anthropic.com` QUALIFIER is
      unreliable for co-authored commits. Org-scoped it returned 0 for QwenLM/deepseek-ai/
      SakanaAI, while BARE-TERM `noreply@anthropic.com` returned 251/5/33 respectively and
      the footer text `Generated with [Claude Code]` returned 26/5/11. The qualifier
      matches the PRIMARY author field only; Claude is a CO-author (human authors), so it
      slips through. Globally the qualifier still returns 5.3M (commits where the bot email
      IS primary), but bare-term returns 15.7M. => Stage 0 MUST use bare-term email + footer
      search, not the qualifier. The "6.3M via author-email" basis was over-optimistic for
      org/repo-scoped recall. Full evidence: artifacts/agent_detection_cues.md.

  # Additional PR-authoring agents discovered 2026-06-26 (global is:pr author counts).
  # Adding these barely moved the AI-lab cross-tab, so the six above + claude[bot]
  # capture nearly all DETECTABLE agent PRs; included for completeness/coverage.
  - { name: Codegen,        detection: author_search, author_logins: ["codegen-sh[bot]"],        counts: { pr_author: 9564 }, status: confirmed }
  - { name: Amazon Q Dev,   detection: author_search, author_logins: ["amazon-q-developer[bot]"], counts: { pr_author: 2240 }, status: confirmed }
  - { name: Factory Droid,  detection: author_search, author_logins: ["factory-droid[bot]"],      counts: { pr_author: 670 },  status: confirmed }
  # Probed and INVISIBLE (no PR-author bot, local-only): Windsurf/Cascade, Tabnine,
  # Augment, Zencoder, Cosine, Blackbox, OpenHands(resolver), Sweep, Gemini Code Assist.
  # `aider` leaves a small co-author trailer (detectable via bare-term, low volume).

# Stage 0 implication (REVISED 2026-06-26): run TWO seed loops, date-windowed under the
# 1000/30-min limits -- (1) /search/issues author: for the bot-author agents (Devin,
# Copilot, Cursor[bot], Jules, Codegen, Amazon Q, Factory Droid, claude[bot]); and
# (2) /search/commits BARE-TERM (NOT author-email: qualifier -- it misses co-authored
# commits org-scoped, see Claude Code note) for: Claude Code (`noreply@anthropic.com` +
# footer `Generated with [Claude Code]`), Cursor Agent (`cursoragent@cursor.com`), Codex
# (`chatgpt-codex-connector[bot]` committer + `codex@openai.com`), aider. Then resolve
# each matched commit to its PR. Decide commit->PR mapping cost in 0.5.
