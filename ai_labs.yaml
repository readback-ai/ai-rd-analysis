# ai_labs.yaml — curated top AI labs/orgs for the ORG-PROVENANCE seed.
#
# Why this exists: per-repo "is this core AI R&D?" classification is inherently
# fuzzy (see RUBRIC.md boundary cases — lantern-os, skilllite). Org provenance is
# a near-binary, high-precision signal: any public repo under a Tier-1 org is
# in-scope by construction, no classifier call needed. This is a SECOND selection
# axis, complementary to the Stage 2 classifier — it trades coverage (only these
# orgs) for precision (~1.0) and answers "what are dev practices AT leading labs".
#
# Verified against the live GitHub API on 2026-06-26 via `gh api users/<login>`
# (login, type=Organization, public_repos). repos counts are as-of that date and
# drift; re-verify before a collection run.
#
# OPEN DESIGN QUESTION (for Ron, see note at bottom): is the unit still
# coding-agent PRs *within* these orgs, or "open dev practices at these orgs"
# broadly? Top labs may use few of the tracked PR-author agents publicly.

meta:
  verified: 2026-06-26
  method: gh api users/<login>
  selection_axis: org_provenance        # complementary to classifier (domain axis)
  precision: ~1.0 for tier1; tier2 requires sub-org/repo curation

