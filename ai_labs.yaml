# ---------------------------------------------------------------------------
# TIER 2 — big-tech / mixed orgs. Org-level is TOO BROAD; scope to the named
# AI sub-orgs (verified) and/or a per-repo allowlist (TODO). Do NOT take whole org.
# ---------------------------------------------------------------------------
tier2_bigtech_curate:
  # repo_allowlist = curated AI repos, verified live 2026-06-26 (top-starred AI repos;
  # *-for-beginners courses, demos, and non-AI repos excluded). Representative, not
  # exhaustive — re-run the stars+AI-keyword sweep to refresh. owner/<repo> = in-scope.
  microsoft:                                   # 8145 repos — mostly non-AI
    whole_org: false
    repo_allowlist: [DeepSpeed, autogen, semantic-kernel, unilm, LoRA, markitdown,
      guidance, promptflow, qlib, nni, BitNet, graphrag, TaskWeaver, FLAML, Olive,
      RD-Agent, JARVIS, OmniParser, agent-lightning, onnxruntime, VibeVoice,
      Swin-Transformer, data-formulator]
  google:                                      # 2881 repos
    whole_org: false
    ai_sub_orgs: [google-research, google-deepmind, jax-ml, tensorflow]   # all tier1 now
    repo_allowlist: [langextract, adk-python, adk-go, adk-samples, magika, skills,
      sentencepiece, dopamine, trax, flax, gemma.cpp, gemma_pytorch, seq2seq]
  nvidia:                                      # NVIDIA Corp 756 repos
    whole_org: false
    ai_sub_orgs: [NVlabs, NVIDIA-NeMo]         # in tier1
    repo_allowlist: [Megatron-LM, TensorRT-LLM, TensorRT, NemoClaw, cosmos, apex,
      garak, Isaac-GR00T, OpenShell, FasterTransformer, DALI, DeepLearningExamples,
      GenerativeAIExamples, TransformerEngine, DIGITS, tacotron2, vid2vid, pix2pixHD,
      SkillSpector, flownet2-pytorch]
  apple:                                       # 432 repos
    whole_org: false
    ai_sub_orgs: [ml-explore]                  # MLX, in tier1
    repo_allowlist: [ml-stable-diffusion, corenet, axlearn, coremltools, ml-fastvlm,
      ml-ferret, ml-depth-pro, ml-4m, ml-mobileclip, ml-aim, ml-cvnets,
      ml-ane-transformers, embedding-atlas, turicreate, coreai-models,
      python-apple-fm-sdk, ml-fastvit]
  amazon:
    whole_org: false
    ai_sub_orgs: [amazon-science]              # promoted to tier1 (mostly AI research)
    awslabs:                                   # 1013 repos — mixed; AI subset:
      repo_allowlist: [gluonts, sockeye, fortuna, multi-model-server, dgl-ke,
