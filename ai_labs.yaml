# ---------------------------------------------------------------------------
# ANALYSIS EXCLUSION — Meta-controlled orgs (Ron, 2026-06-26):
#   meta-llama, facebookresearch, and pytorch are EXCLUDED from the AI-use / dev-practices
#   analysis. Meta develops with internal tooling that leaves no public attribution, so
#   their detectable agent/AI signal is either ~0 (meta-llama) or dominated by EXTERNAL
#   contributors (pytorch: 100 agent PRs but they're outside contributors, not Meta staff).
#   Including them would misrepresent "Meta's practices." Keep them in the org list for
#   provenance/repo coverage, but tag out of the practices metrics.
# ---------------------------------------------------------------------------
# Handle notes / gotchas surfaced during verification (2026-06-26):
# - `deepmind` 301-redirects to `google-deepmind`; use the latter.
# - GLM provenance spans TWO orgs: THUDM (older ChatGLM) + zai-org (current GLM).
# - `zhipuai` exists but is near-empty (3 repos) — not the canonical org; use zai-org.
# - facebookresearch is huge (1413) and predominantly AI but not 100% — flagged mixed.
# ---------------------------------------------------------------------------
