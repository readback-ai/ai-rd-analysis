name: ci
on:
  push:
    branches: [main, ai-dev-practices]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src scripts tests
      - run: uv run pytest -q
      - run: uv run python -c "import pipeline.detect, pipeline.org_set"
